<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — iSard App</title>
    <link rel="icon" type="image/png" href="/iSard_icon.png">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/header.css">
    <script src="/js/theme.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 24px 60px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
            text-align: center;
            max-width: 480px;
            line-height: 1.5;
        }

        .email-line {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 32px;
            text-align: center;
        }

        .email-line a {
            color: var(--text-primary);
            font-weight: 600;
            text-decoration: none;
        }

        .email-line a:hover {
            text-decoration: underline;
        }

        #chat-area {
            width: 100%;
            max-width: 800px;
        }

        .chat-container {
            width: 100%;
            height: 580px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px var(--shadow);
            background: var(--bg-surface);
        }

        #conversations-wrapper iframe {
            width: 100% !important;
            min-width: 100% !important;
            height: 100% !important;
        }

        .chat-consent {
            width: 100%;
            max-width: 800px;
            background: var(--bg-surface);
            border-radius: 12px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 2px 12px var(--shadow);
        }

        .chat-consent p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .chat-consent button {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 8px;
            border: none;
            background: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
        }

        .chat-consent button:hover {
            background: var(--btn-hover);
        }

        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.22);
            padding: 24px 40px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-logo {
            height: 32px;
            width: auto;
        }

        .privacy-link {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .privacy-link:hover {
            text-decoration: underline;
        }

        .cookie-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-light);
            padding: 16px 24px;
            z-index: 9999;
            box-shadow: 0 -2px 8px var(--shadow);
        }

        .cookie-content {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .cookie-content p {
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--text-secondary);
            margin: 0;
        }

        .cookie-content a {
            color: var(--text-primary);
            text-decoration: underline;
        }

        .cookie-buttons {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .cookie-accept, .cookie-settings-btn, .cookie-save {
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .cookie-accept {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
        }

        .cookie-settings-btn {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .cookie-settings-btn:hover {
            border-color: var(--text-muted);
        }

        .cookie-settings-content {
            max-width: 960px;
            margin: 0 auto;
        }

        .cookie-settings-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .cookie-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            gap: 16px;
        }

        .cookie-option-text {
            display: flex;
            gap: 12px;
            align-items: baseline;
        }

        .cookie-option-name {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .cookie-option-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .cookie-toggle {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .cookie-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .cookie-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--toggle-slider-bg);
            border-radius: 24px;
            transition: 0.2s;
        }

        .cookie-slider::before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: var(--bg-surface);
            border-radius: 50%;
            transition: 0.2s;
        }

        .cookie-toggle input:checked + .cookie-slider {
            background-color: var(--accent);
        }

        .cookie-toggle input:checked + .cookie-slider::before {
            transform: translateX(20px);
        }

        .cookie-toggle.disabled .cookie-slider {
            cursor: default;
            opacity: 0.7;
        }

        .cookie-save {
            margin-top: 12px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
        }

        @media (max-width: 600px) {
            .content {
                padding: 24px 16px 40px;
            }

            h1 {
                font-size: 1.4rem;
            }

            #chat-area {
                max-width: 100%;
            }

            .chat-container {
                height: 460px;
                border-radius: 0;
            }

            footer {
                padding: 20px 24px 80px;
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .footer-meta {
                justify-content: center;
            }

            .cookie-content {
                flex-direction: column;
                text-align: center;
            }
        }
    
        .footer-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 10px 24px;
        }

        .footer-legal {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .footer-social {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .footer-social a {
            display: flex;
            color: var(--text-muted);
            transition: color 0.15s ease;
        }

        .footer-social a:hover {
            color: var(--accent);
        }

        .footer-social svg {
            width: 18px;
            height: 18px;
        }
</style>
</head>
<body>
    <div class="content">
        <h1 data-i18n="heading">Contacto</h1>
        <p class="subtitle" data-i18n="subtitle">Escríbenos por el chat o envíanos un email. Te responderemos lo antes posible.</p>
        <p class="email-line" data-i18n="email_label">Email: <a href="#" id="contact-email-link"><span id="contact-email"></span></a></p>
        <div id="chat-area"></div>
    </div>

            </div>

    <script>
        (function(){
            var u='hola',d='isard.app',e=u+'@'+d;
            var span = document.getElementById('contact-email');
            var link = document.getElementById('contact-email-link');
            if(span) span.textContent = e;
            if(link) link.href = 'mai'+'lto:'+e;
        })();
    </script>
    <script src="/js/header.js"></script>
    <script src="/js/i18n.js"></script>
    <script>
        var consentTexts = {
            es: {
                consentMsg: 'Para usar el chat necesitamos tu consentimiento para cargar el widget de Brevo Conversations.',
                consentBtn: 'Aceptar y abrir chat'
            },
            ca: {
                consentMsg: 'Per usar el xat necessitem el teu consentiment per carregar el widget de Brevo Conversations.',
                consentBtn: 'Acceptar i obrir xat'
            },
            en: {
                consentMsg: 'To use the chat we need your consent to load the Brevo Conversations widget.',
                consentBtn: 'Accept and open chat'
            }
        };

        function getLang() {
            var stored = localStorage.getItem('isard-lang');
            return (stored && consentTexts[stored]) ? stored : 'es';
        }

        function loadBrevoFrame() {
            var area = document.getElementById('chat-area');
            area.innerHTML = '<div id="conversations-wrapper" class="chat-container"></div>';
            window.BrevoConversationsSetup = {
                mode: 'frame',
                injectTo: 'conversations-wrapper',
                locale: getLang()
            };
            window.BrevoConversationsID = '69e161ed30e28454ca00bd4d';
            window.BrevoConversations = window.BrevoConversations || function() {
                (window.BrevoConversations.q = window.BrevoConversations.q || []).push(arguments);
            };
            var s = document.createElement('script');
            s.async = true;
            s.src = 'https://conversations-widget.brevo.com/brevo-conversations.js';
            document.head.appendChild(s);

            var container = document.getElementById('conversations-wrapper');
            var observer = new MutationObserver(function() {
                container.style.width = '100%';
                container.style.minWidth = '100%';
                var iframe = container.querySelector('iframe');
                if (iframe) {
                    iframe.style.width = '100%';
                    iframe.style.minWidth = '100%';
                    iframe.style.height = '100%';
                }
            });
            observer.observe(container, { childList: true, subtree: true, attributes: true });
        }

        function showConsentBox() {
            var lang = getLang();
            var t = consentTexts[lang];
            var area = document.getElementById('chat-area');
            area.innerHTML =
                '<div class="chat-consent">' +
                    '<p>' + t.consentMsg + '</p>' +
                    '<button id="consent-btn">' + t.consentBtn + '</button>' +
                '</div>';
            document.getElementById('consent-btn').addEventListener('click', function() {
                localStorage.setItem('isard-cookies', 'accepted');
                loadBrevoFrame();
            });
        }

        var consent = localStorage.getItem('isard-cookies');
        if (consent === 'accepted') {
            loadBrevoFrame();
        } else {
            showConsentBox();
        }

        window.onLangChange = function(lang) {
            var consent = localStorage.getItem('isard-cookies');
            if (consent !== 'accepted') {
                showConsentBox();
            }
        };

        i18nInit({
            es: {
                heading: 'Contacto',
                subtitle: 'Escríbenos por el chat o envíanos un email. Te responderemos lo antes posible.',
                email_label: 'Email: <a href="#" id="contact-email-link"><span id="contact-email"></span></a>',
                privacy: 'Política de Privacidad',
                footer_legal: 'iSard © 2026'
            },
            ca: {
                heading: 'Contacte',
                subtitle: 'Escriu-nos pel xat o envia\'ns un email. Et respondrem el més aviat possible.',
                email_label: 'Email: <a href="#" id="contact-email-link"><span id="contact-email"></span></a>',
                privacy: 'Política de Privacitat',
                footer_legal: 'iSard © 2026'
            },
            en: {
                heading: 'Contact',
                subtitle: 'Write to us via chat or send us an email. We\'ll get back to you as soon as possible.',
                email_label: 'Email: <a href="#" id="contact-email-link"><span id="contact-email"></span></a>',
                privacy: 'Privacy Policy',
                footer_legal: 'iSard © 2026'
            }
        });

        // Re-obfuscate email after i18n replaces innerHTML
        (function(){
            var u='hola',d='isard.app',e=u+'@'+d;
            var span = document.getElementById('contact-email');
            var link = document.getElementById('contact-email-link');
            if(span) span.textContent = e;
            if(link) link.href = 'mai'+'lto:'+e;
        })();
    </script>
</body>
</html>
